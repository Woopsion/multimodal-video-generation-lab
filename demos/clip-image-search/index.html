<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CLIP Image Search</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f5ef;
        --surface: #fffdf6;
        --surface-strong: #f0ede2;
        --ink: #20201c;
        --muted: #706d63;
        --line: #d9d3c3;
        --accent: #1d8f6f;
        --accent-strong: #0f6b54;
        --reject: #b64a3b;
        --shadow: 0 18px 55px rgba(52, 46, 30, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(135deg, rgba(29, 143, 111, 0.08), transparent 38%),
          var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      .shell {
        width: min(1180px, calc(100vw - 40px));
        margin: 0 auto;
        padding: 34px 0 44px;
      }

      header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 24px;
        align-items: end;
        padding-bottom: 26px;
        border-bottom: 1px solid var(--line);
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--accent-strong);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(38px, 6vw, 78px);
        line-height: 0.92;
        letter-spacing: 0;
      }

      .subhead {
        max-width: 720px;
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.65;
      }

      .status {
        min-width: 210px;
        padding: 16px 18px;
        background: var(--surface);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }

      .status-label {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .status-value {
        margin: 0;
        font-size: 18px;
        font-weight: 800;
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 28px;
        margin-top: 28px;
      }

      .workspace,
      .side {
        background: rgba(255, 253, 246, 0.88);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }

      .workspace {
        padding: 24px;
      }

      .side {
        padding: 20px;
      }

      .search-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 140px 120px;
        gap: 12px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }

      input {
        width: 100%;
        height: 46px;
        padding: 0 14px;
        color: var(--ink);
        background: white;
        border: 1px solid var(--line);
        border-radius: 6px;
        outline: none;
      }

      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(29, 143, 111, 0.16);
      }

      button {
        height: 46px;
        border: 0;
        border-radius: 6px;
        color: white;
        background: var(--accent);
        font-weight: 800;
        cursor: pointer;
      }

      button:hover {
        background: var(--accent-strong);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.62;
      }

      .presets {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }

      .preset {
        width: auto;
        height: 34px;
        padding: 0 10px;
        color: var(--ink);
        background: var(--surface-strong);
        border: 1px solid var(--line);
        font-size: 13px;
      }

      .preset:hover {
        color: white;
        background: var(--accent);
      }

      .decision {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin: 24px 0 18px;
        padding: 18px 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .decision h2 {
        margin: 0;
        font-size: 24px;
        letter-spacing: 0;
      }

      .decision p {
        margin: 4px 0 0;
        color: var(--muted);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        min-width: 92px;
        justify-content: center;
        height: 34px;
        padding: 0 12px;
        border-radius: 999px;
        color: white;
        background: var(--accent);
        font-size: 13px;
        font-weight: 900;
        text-transform: uppercase;
      }

      .badge.reject {
        background: var(--reject);
      }

      .results {
        display: grid;
        gap: 12px;
      }

      .result {
        display: grid;
        grid-template-columns: 76px minmax(0, 1fr) 92px;
        gap: 14px;
        align-items: center;
        padding: 12px;
        background: white;
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .result img,
      .gallery img {
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        background: white;
        border: 1px solid var(--line);
        border-radius: 6px;
      }

      .rank {
        margin: 0 0 5px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .name {
        margin: 0;
        font-size: 17px;
        font-weight: 800;
      }

      .score {
        text-align: right;
      }

      .score strong {
        display: block;
        font-size: 18px;
      }

      .score span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .score-bar {
        grid-column: 2 / 4;
        height: 6px;
        overflow: hidden;
        background: var(--surface-strong);
        border-radius: 999px;
      }

      .score-fill {
        height: 100%;
        background: var(--accent);
        border-radius: inherit;
        transition: width 180ms ease;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .gallery-item {
        padding: 10px;
        background: white;
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .gallery-item p {
        min-height: 36px;
        margin: 8px 0 0;
        font-size: 13px;
        font-weight: 800;
        line-height: 1.35;
      }

      .meta {
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }

      .meta p {
        margin: 0 0 9px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .error {
        margin-top: 18px;
        color: var(--reject);
        font-weight: 800;
      }

      @media (max-width: 900px) {
        header,
        main,
        .search-row {
          grid-template-columns: 1fr;
        }

        .status {
          min-width: 0;
        }
      }

      @media (max-width: 560px) {
        .shell {
          width: min(100vw - 24px, 1180px);
          padding-top: 22px;
        }

        .workspace,
        .side {
          padding: 16px;
        }

        .decision {
          align-items: flex-start;
          flex-direction: column;
        }

        .result {
          grid-template-columns: 64px minmax(0, 1fr);
        }

        .score {
          grid-column: 2;
          text-align: left;
        }

        .score-bar {
          grid-column: 1 / 3;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div>
          <p class="eyebrow">Day 10 retrieval demo</p>
          <h1>CLIP Image Search</h1>
          <p class="subhead">
            Text query in, four generated images out. The top score is accepted only when it
            clears the current threshold.
          </p>
        </div>
        <div class="status" aria-live="polite">
          <p class="status-label">Model status</p>
          <p class="status-value" id="modelStatus">Loading</p>
        </div>
      </header>

      <main>
        <section class="workspace" aria-label="Search workspace">
          <form id="searchForm">
            <div class="search-row">
              <div>
                <label for="queryInput">Query</label>
                <input
                  id="queryInput"
                  data-testid="search-input"
                  name="q"
                  value="a red square on a white background"
                  autocomplete="off"
                />
              </div>
              <div>
                <label for="thresholdInput">Threshold</label>
                <input
                  id="thresholdInput"
                  data-testid="threshold-input"
                  type="number"
                  min="0"
                  max="100"
                  step="0.1"
                  value="28.0"
                />
              </div>
              <div>
                <label>&nbsp;</label>
                <button id="searchButton" data-testid="search-button" type="submit">
                  Search
                </button>
              </div>
            </div>
            <div class="presets" aria-label="Preset queries">
              <button class="preset" type="button" data-query="a red square on a white background">
                red square
              </button>
              <button class="preset" type="button" data-query="a blue circle on a white background">
                blue circle
              </button>
              <button class="preset" type="button" data-query="a green triangle on a white background">
                green triangle
              </button>
              <button class="preset" type="button" data-query="a bowl of noodles on a table">
                noodles
              </button>
              <button class="preset" type="button" data-query="a photo of a dog on grass">
                dog
              </button>
              <button class="preset" type="button" data-query="a city street at night">
                city
              </button>
              <button class="preset" type="button" data-query="a person riding a horse">
                horse
              </button>
            </div>
          </form>

          <div class="decision" data-testid="decision-panel">
            <div>
              <h2 id="decisionTitle">Waiting for query</h2>
              <p id="decisionText">Run retrieval to inspect top-k scores.</p>
            </div>
            <span class="badge" id="decisionBadge">Idle</span>
          </div>

          <div id="results" class="results" data-testid="results"></div>
          <div id="error" class="error" role="alert"></div>
        </section>

        <aside class="side" aria-label="Image gallery">
          <label>Gallery</label>
          <div id="gallery" class="gallery" data-testid="gallery"></div>
          <div class="meta">
            <p id="modelName">model: loading</p>
            <p id="shapeLine">shape: waiting</p>
          </div>
        </aside>
      </main>
    </div>

    <script>
      const form = document.querySelector("#searchForm");
      const queryInput = document.querySelector("#queryInput");
      const thresholdInput = document.querySelector("#thresholdInput");
      const searchButton = document.querySelector("#searchButton");
      const resultsEl = document.querySelector("#results");
      const galleryEl = document.querySelector("#gallery");
      const errorEl = document.querySelector("#error");
      const decisionTitle = document.querySelector("#decisionTitle");
      const decisionText = document.querySelector("#decisionText");
      const decisionBadge = document.querySelector("#decisionBadge");
      const modelStatus = document.querySelector("#modelStatus");
      const modelName = document.querySelector("#modelName");
      const shapeLine = document.querySelector("#shapeLine");

      function setDecision(payload) {
        const accepted = payload.accepted;
        decisionTitle.textContent = accepted ? "Accepted result" : "Rejected result";
        decisionText.textContent = `top-1 score ${payload.top1_score} vs threshold ${payload.accept_threshold}`;
        decisionBadge.textContent = accepted ? "Accept" : "Reject";
        decisionBadge.classList.toggle("reject", !accepted);
      }

      function renderResults(payload) {
        const maxScore = Math.max(...payload.results.map((item) => item.score), 1);
        resultsEl.replaceChildren(
          ...payload.results.map((item) => {
            const row = document.createElement("article");
            row.className = "result";
            const img = document.createElement("img");
            img.src = item.image_data_url;
            img.alt = item.name;

            const body = document.createElement("div");
            const rank = document.createElement("p");
            rank.className = "rank";
            rank.textContent = `rank ${item.rank} · image ${item.index}`;
            const name = document.createElement("p");
            name.className = "name";
            name.textContent = item.name;
            body.append(rank, name);

            const score = document.createElement("div");
            score.className = "score";
            const scoreValue = document.createElement("strong");
            scoreValue.textContent = item.score.toFixed(4);
            const scoreLabel = document.createElement("span");
            scoreLabel.textContent = "score";
            score.append(scoreValue, scoreLabel);

            const bar = document.createElement("div");
            bar.className = "score-bar";
            const fill = document.createElement("div");
            fill.className = "score-fill";
            fill.style.width = `${Math.max(6, (item.score / maxScore) * 100)}%`;
            bar.append(fill);

            row.append(img, body, score, bar);
            return row;
          })
        );
        shapeLine.textContent = `shape: logits_per_text = [${payload.shapes.logits_per_text.join(", ")}]`;
      }

      async function runSearch() {
        const query = queryInput.value.trim();
        if (!query) return;
        errorEl.textContent = "";
        searchButton.disabled = true;
        searchButton.textContent = "Searching";
        try {
          const url = new URL("/api/search", window.location.origin);
          url.searchParams.set("q", query);
          url.searchParams.set("top_k", "3");
          url.searchParams.set("threshold", thresholdInput.value);
          const response = await fetch(url);
          const payload = await response.json();
          if (!response.ok) {
            throw new Error(payload.error || "Search failed");
          }
          setDecision(payload);
          renderResults(payload);
        } catch (error) {
          errorEl.textContent = error.message;
        } finally {
          searchButton.disabled = false;
          searchButton.textContent = "Search";
        }
      }

      async function loadGallery() {
        const response = await fetch("/api/gallery");
        const payload = await response.json();
        galleryEl.replaceChildren(
          ...payload.gallery.map((item) => {
            const wrap = document.createElement("div");
            wrap.className = "gallery-item";
            const img = document.createElement("img");
            img.src = item.image_data_url;
            img.alt = item.name;
            const text = document.createElement("p");
            text.textContent = `${item.index}. ${item.name}`;
            wrap.append(img, text);
            return wrap;
          })
        );
        modelStatus.textContent = "Ready";
        thresholdInput.value = payload.default_accept_threshold.toFixed(1);
        modelName.textContent = `model: ${payload.model}`;
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        runSearch();
      });

      document.querySelectorAll("[data-query]").forEach((button) => {
        button.addEventListener("click", () => {
          queryInput.value = button.dataset.query;
          runSearch();
        });
      });

      loadGallery().then(runSearch).catch((error) => {
        modelStatus.textContent = "Error";
        errorEl.textContent = error.message;
      });
    </script>
  </body>
</html>
